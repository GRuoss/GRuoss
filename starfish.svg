<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="180" height="180" role="img" aria-label="A sleepy pink starfish">
  <defs>
    <radialGradient id="g" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffc2d8"/>
      <stop offset="100%" stop-color="#f48fb1"/>
    </radialGradient>
  </defs>
  <!-- a lumpy, friendly five-armed starfish -->
  <path d="M110 12 C122 12 128 58 136 74 C150 80 204 78 208 92 C212 106 168 128 160 142
           C164 160 182 200 170 208 C158 216 124 186 110 182 C96 186 62 216 50 208
           C38 200 56 160 60 142 C52 128 8 106 12 92 C16 78 70 80 84 74 C92 58 98 12 110 12 Z"
        fill="url(#g)" stroke="#d81b60" stroke-width="3" stroke-linejoin="round"/>
  <!-- freckles -->
  <g fill="#ec6f9b">
    <circle cx="78" cy="96" r="3"/><circle cx="148" cy="104" r="3"/><circle cx="96" cy="150" r="2.5"/>
    <circle cx="132" cy="160" r="2.5"/><circle cx="110" cy="40" r="2.5"/>
  </g>
  <!-- sleepy eyes -->
  <g stroke="#3a2a33" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M90 104 q8 6 16 0"/>
    <path d="M116 104 q8 6 16 0"/>
  </g>
  <!-- happy little mouth -->
  <path d="M96 124 q14 14 28 0" stroke="#3a2a33" stroke-width="3" fill="#b0003a" stroke-linecap="round"/>
  <!-- thought bubble -->
  <g fill="#ffffff" stroke="#9e9e9e" stroke-width="2">
    <circle cx="176" cy="40" r="6"/><circle cx="190" cy="24" r="9"/>
  </g>
  <text x="190" y="28" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#9e9e9e">…</text>
</svg>
