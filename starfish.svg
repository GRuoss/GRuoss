<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 240 250" width="190" height="198" role="img" aria-label="A pink starfish with a wooden plank nailed to its head">
  <defs>
    <radialGradient id="skin" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffc2d8"/>
      <stop offset="100%" stop-color="#f48fb1"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a66b"/>
      <stop offset="100%" stop-color="#b9824a"/>
    </linearGradient>
  </defs>

  <!-- starfish body (shifted down to make room for the plank) -->
  <g transform="translate(10,36)">
    <path d="M110 12 C122 12 128 58 136 74 C150 80 204 78 208 92 C212 106 168 128 160 142
             C164 160 182 200 170 208 C158 216 124 186 110 182 C96 186 62 216 50 208
             C38 200 56 160 60 142 C52 128 8 106 12 92 C16 78 70 80 84 74 C92 58 98 12 110 12 Z"
          fill="url(#skin)" stroke="#d81b60" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#ec6f9b">
      <circle cx="78" cy="96" r="3"/><circle cx="148" cy="104" r="3"/>
      <circle cx="96" cy="150" r="2.5"/><circle cx="132" cy="160" r="2.5"/>
    </g>
    <!-- wide, slightly dazed eyes -->
    <g>
      <ellipse cx="96" cy="100" rx="11" ry="12" fill="#fff" stroke="#3a2a33" stroke-width="2.5"/>
      <ellipse cx="124" cy="100" rx="11" ry="12" fill="#fff" stroke="#3a2a33" stroke-width="2.5"/>
      <circle cx="99" cy="103" r="3.5" fill="#3a2a33"/>
      <circle cx="121" cy="97" r="3.5" fill="#3a2a33"/>
    </g>
    <!-- content grin -->
    <path d="M90 126 q20 18 40 0" stroke="#3a2a33" stroke-width="3" fill="#b0003a" stroke-linecap="round"/>
    <rect x="104" y="127" width="7" height="6" fill="#fff" stroke="#3a2a33" stroke-width="1"/>
    <rect x="111" y="127" width="7" height="6" fill="#fff" stroke="#3a2a33" stroke-width="1"/>
  </g>

  <!-- the plank, resting on the top arm at a jaunty angle -->
  <g transform="translate(0,22) rotate(-8 120 40)">
    <rect x="38" y="26" width="164" height="26" rx="3" fill="url(#wood)" stroke="#7a5230" stroke-width="2.5"/>
    <!-- wood grain -->
    <g stroke="#9c6b3c" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M48 34 q30 -4 60 0 t60 0"/>
      <path d="M52 44 q26 4 52 0 t70 2"/>
      <ellipse cx="160" cy="39" rx="7" ry="3.5"/>
    </g>
    <!-- the nail, right through the middle -->
    <circle cx="120" cy="39" r="6" fill="#b0b7bf" stroke="#5f6870" stroke-width="2"/>
    <circle cx="118.5" cy="37.5" r="1.8" fill="#e6eaee"/>
  </g>
</svg>
